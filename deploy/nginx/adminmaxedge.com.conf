        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}

# ---- adminmaxedge.com (apex) -> redirect to app.adminmaxedge.com ----------
# PLACEHOLDER: nothing in this repo claims the apex domain today. Redirecting
# to the trader panel ("app") as the most likely primary landing surface —
# confirm this is actually what should happen before relying on it.
server {
    listen 80;
    listen [::]:80;
    server_name adminmaxedge.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 302 http://app.adminmaxedge.com$request_uri;
    }
}
