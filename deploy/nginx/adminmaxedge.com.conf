# ---- api.adminmaxedge.com -> backend/ (4000), REST + Socket.IO ------------
server {
    listen 80;
    listen [::]:80;
    server_name api.adminmaxedge.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Socket.IO long-lived connections — don't let Nginx's default
        # proxy timeouts kill an idle-but-open WebSocket.
        proxy_read_timeout 3600s;
    }
}

# ---- ngo-api.adminmaxedge.com -> ngo-backend/ (3000), REST + Socket.IO ----
server {
    listen 80;
