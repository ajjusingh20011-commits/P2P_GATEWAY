# ---------------------------------------------------------------------------
# adminmaxedge.com — Nginx server blocks, PHASE 1 (HTTP-only, staged).
#
# Deploy: copy this file to /etc/nginx/sites-available/adminmaxedge.com.conf
# on the VPS, symlink into sites-enabled, `nginx -t`, then `systemctl reload
# nginx`. Do this NOW — it works over plain HTTP immediately and doesn't
# need DNS to have propagated for the raw-IP testing already in progress.
#
# Subdomain -> local port map (confirmed from this repo's own .env files):
#   admin.adminmaxedge.com     -> 127.0.0.1:5173  (frontend/admin, static build)
#   app.adminmaxedge.com       -> 127.0.0.1:5174  (frontend/trader, static build)
#   merchant.adminmaxedge.com  -> 127.0.0.1:5175  (frontend/merchant, static build)
#   checkout.adminmaxedge.com  -> 127.0.0.1:5176  (frontend/checkout, static build)
#   api.adminmaxedge.com       -> 127.0.0.1:4000  (backend/, p2p gateway API + WS)
#   ngo-api.adminmaxedge.com   -> 127.0.0.1:3000  (ngo-backend/, device/scraper API + WS)
#   adminmaxedge.com (apex)    -> redirects to app.adminmaxedge.com (placeholder —
#                                 confirm this is the right landing target before
#                                 relying on it; nothing else claims the apex today)
#
# PHASE 2 (once DNS has propagated and certbot has run): certbot --nginx will
# rewrite each block below in place, adding the `listen 443 ssl` server and an
# HTTP->HTTPS redirect on port 80. Nothing further needs to change here by
# hand; just re-run this file's Phase 2 companion instructions after certbot.
# ---------------------------------------------------------------------------

# Shared proxy settings for every app server below.
# (Nginx doesn't support macro-includes without a snippet file, so this is
# duplicated per block below — kept identical on purpose.)

# ---- admin.adminmaxedge.com -> frontend/admin (5173) ----------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.adminmaxedge.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

